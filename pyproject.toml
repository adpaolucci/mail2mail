[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mail2mail"
version = "2.1.0"
description = "Universal Email & Mailbox Converter (MBOX, Thunderbird ImapMail/Mail, Maildir/Maildir++, Apple Mail .emlx/.mbox, Outlook .msg/.olm/.pst, MH, MMDF, Babyl, EML, and compressed archives <-> EML, MBOX, or Outlook PST)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
]
keywords = ["email", "mbox", "eml", "pst", "outlook", "thunderbird", "maildir", "emlx", "olm", "msg"]

[project.scripts]
mail2mail = "mail2mail:main"
mail2eml = "mail2eml:main"
mail2mbox = "mail2mbox:main"
mail2pst = "mail2pst:main"

[tool.setuptools]
py-modules = [
    "mail_formats",
    "mail2mail",
    "mail2eml",
    "mail2mbox",
    "mail2pst",
]
