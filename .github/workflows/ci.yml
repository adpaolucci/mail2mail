name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile all Python modules
        run: python -m py_compile mail_formats.py mail_audit.py mail_filter.py mail_shutdown.py mail2mail.py mail2eml.py mail2mbox.py mail2pst.py mail2jmap.py mail2mcp.py file_picker.py

      - name: Run automated RFC compliance and format test suite
        run: python -m unittest discover -s tests -v

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package in editable mode
        run: python -m pip install --no-deps -e .

      - name: Verify CLI entry points
        run: mail2mail --help
